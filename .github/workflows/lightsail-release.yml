name: Build and deploy Lightsail release
on:
  push:
    branches: [release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightsail-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mnlauaa/TREK' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify backup protection
        run: python3 -m unittest discover -s deploy/argocd -p 'test_*.py' -v
      - name: Read application version
        id: version
        run: echo "value=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/mnlauaa/trek:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mnlauaa/TREK
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            SOURCE_CODE_URL=https://github.com/mnlauaa/TREK/tree/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Render desired state
        env:
          IMAGE: ghcr.io/mnlauaa/trek@${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 deploy/argocd/render.py "$IMAGE" "$SOURCE_SHA" \
            docker.io/library/python@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30 \
            > /tmp/trek-manifests.json
      - name: Promote current release and notify Argo CD
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          ARGOCD_WEBHOOK_SECRET: ${{ secrets.ARGOCD_WEBHOOK_SECRET }}
        run: python3 deploy/argocd/promote.py
